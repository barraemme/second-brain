name: second-brain

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-second_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-second_brain_pw}
      POSTGRES_DB: ${POSTGRES_DB:-second_brain}
    ports:
      - "5433:5432"
    volumes:
      - kb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-second_brain} -d ${POSTGRES_DB:-second_brain}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # inspection only
  adminer:
    image: adminer:6.0.1
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  inngest-dev:
    image: inngest/inngest:v1.45.1
    restart: unless-stopped
    command: >
      inngest dev
      -u http://host.docker.internal:${LAB_PORT:-8080}/api/inngest
    ports:
      - "8288:8288"
      - "8289:8289"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  memgraph:
    image: memgraph/memgraph-mage:latest
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - kb_memgraph_data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # inspection UI for Memgraph.
  memgraph-lab:
    image: memgraph/lab:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: 7687
    depends_on:
      - memgraph

volumes:
  kb_postgres_data:
  kb_memgraph_data:
